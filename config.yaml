paths:
  data: data
  cache: cache
  results: results

whisper:
  model: large-v3
  backend: faster-whisper
  compute_type: float16
  beam_size: 5
  temperature: 0.0
  condition_on_previous_text: false
  vad_filter: true
  language: en

sample_plan:
  mode: full

books:
  - book_id: pride_and_prejudice
    gutenberg_id: 42671  # 3-vol plain edition; 1342 is illustration-only chapter breaks, unusable for regex splitting
    librivox_id: 253  # confirmed via LibriVox API in M09; 13 readers (one per section, not single-narrator across the whole book)
    librivox_url: "https://librivox.org/pride-and-prejudice-by-jane-austen/"
    chapter_regex: "^CHAPTER [IVXLC]+\\.?$"
  - book_id: treasure_island
    gutenberg_id: 120
    librivox_id: 449  # confirmed via LibriVox API in M09; original "version-4" URL doesn't exist. 13 readers (one per section)
    librivox_url: "https://librivox.org/treasure-island-by-robert-louis-stevenson/"
    chapter_regex: "^[IVXLC]+$"
  - book_id: sherlock_holmes
    gutenberg_id: 1661
    librivox_id: 314  # confirmed via LibriVox API in M09; original URL had a wrong "-by-arthur-conan-doyle" suffix. 11 readers (one per section)
    librivox_url: "https://librivox.org/the-adventures-of-sherlock-holmes/"
    chapter_regex: "^[IVXLC]+\\. .+$"
  - book_id: franklin_autobiography
    gutenberg_id: 20203
    librivox_id: 1143  # confirmed via LibriVox API in M07/M09; single narrator (Gary Gilberd) -- also the reference_clip.wav source
    librivox_url: "https://librivox.org/the-autobigraphy-of-benjamin-franklin-ed-by-frank-woodworth-pine/"
    chapter_regex: "^[IVXLC]+$"
    # section "0" (Introduction) and "20" (Appendix) have no text-chapter counterpart, so they're
    # simply absent from this map and skipped on ingest; sections "1"-"19" map straight to chapters 0-18.
    chapter_map:
      "1": "0"
      "2": "1"
      "3": "2"
      "4": "3"
      "5": "4"
      "6": "5"
      "7": "6"
      "8": "7"
      "9": "8"
      "10": "9"
      "11": "10"
      "12": "11"
      "13": "12"
      "14": "13"
      "15": "14"
      "16": "15"
      "17": "16"
      "18": "17"
      "19": "18"
  - book_id: anne_of_green_gables
    gutenberg_id: 45
    librivox_id: 146  # confirmed via LibriVox API in M09; 12 readers (one per section)
    librivox_url: "https://librivox.org/anne-of-green-gables-by-lucy-maud-montgomery/"
    chapter_regex: "^CHAPTER [IVXLC]+\\..*$"

engines:
  piper:
    voice_id: "en_US-lessac-medium"  # verify
    params: {}
    max_chars: 1000
    device: cpu
    model_revision: "1.2.0"  # verify
  kokoro:
    voice_id: "af_heart"  # confirmed: hexgrad/Kokoro-82M's af_heart voice, matches ARCHITECTURE.md's pin
    params: {}
    max_chars: 1000
    device: cpu
    model_revision: "v1.0"  # confirmed: hexgrad/Kokoro-82M v1.0 voices, package kokoro==0.9.4
  xtts:
    voice_id: "reference"
    params: {}
    max_chars: 250  # XTTS v2's own hard limit for English; verified directly against the library (it warns above this)
    device: cuda
    model_revision: "v2.0.3"  # confirmed: coqui-tts==0.27.5's model registry serves "XTTS-v2.0.3", commit 480a6cdf7, hash 10f92b55c512af7a8d39d650547a15a7
    reference_clip: "data/reference_clip.wav"
  f5tts:
    voice_id: "reference"
    params: {}
    max_chars: 400  # no hard limit found in the library (unlike XTTS's 250); tested fine at 250-char chunks. Shared chunk cap is min() across engines, currently 250 via xtts regardless
    device: cuda
    model_revision: "F5TTS_v1_Base"  # confirmed: SWivid/F5-TTS commit 84e5a410d9cead4de2f847e7c9369a6440bdfaca
    reference_clip: "data/reference_clip.wav"
  chatterbox:
    voice_id: "reference"
    params: {}
    max_chars: 400  # no hard limit found (tolerated even empty-string input without error); shared chunk cap is min() across engines, currently 250 via xtts regardless
    device: cuda
    model_revision: "main"  # confirmed: ResembleAI/chatterbox commit 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
    reference_clip: "data/reference_clip.wav"
